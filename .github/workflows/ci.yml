name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: find src/boardy-laravel -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Python syntax check
        run: python -m compileall src/boardy-api/ -q

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          echo "MYSQL_ROOT_PASSWORD=root_secure_password" > .env
          echo "DB_USER=boardy" >> .env
          echo "DB_PASSWORD=boardy_password" >> .env

      - name: Create Laravel .env
        run: |
          cp src/boardy-laravel/.env.example src/boardy-laravel/.env 2>/dev/null || cat > src/boardy-laravel/.env << 'ENVEOF'
          APP_NAME=Boardy
          APP_ENV=local
          APP_KEY=base64:mpvUnT620VfxF5JMrUv8JyEztkIV8OjOsBybr0tis0I=
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=boardy_laravel
          DB_USERNAME=boardy
          DB_PASSWORD=boardy_password
          REDIS_HOST=redis
          REDIS_PORT=6379
          CACHE_DRIVER=redis
          SESSION_DRIVER=redis
          QUEUE_CONNECTION=redis
          ENVEOF

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: |
          docker compose up -d
          for i in {1..30}; do
            curl -fs http://localhost/health && break
            sleep 2
          done

      - name: Smoke endpoints
        run: |
          curl -f http://localhost/health
          curl -f http://localhost/api/health

      - name: Tear down
        if: always()
        run: docker compose down -v

  test:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install PHP deps
        working-directory: ./src/boardy-laravel
        run: composer install --no-interaction --prefer-dist

      - name: Create Laravel .env for tests
        working-directory: ./src/boardy-laravel
        run: |
          cat > .env << 'ENVEOF'
          APP_NAME=Boardy
          APP_ENV=testing
          APP_KEY=base64:mpvUnT620VfxF5JMrUv8JyEztkIV8OjOsBybr0tis0I=
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          ENVEOF

      - name: Run PHPUnit
        working-directory: ./src/boardy-laravel
        run: php artisan test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r src/boardy-api/requirements.txt pytest requests -q

      - name: Run pytest
        working-directory: ./src/boardy-api
        run: pytest tests/test_health.py -v
