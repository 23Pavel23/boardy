name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find src/boardy-laravel -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Python syntax check
        run: python -m compileall src/boardy-api/ -q

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          echo "MYSQL_ROOT_PASSWORD=root_secure_password" > .env
          echo "DB_USER=boardy" >> .env
          echo "DB_PASSWORD=boardy_password" >> .env
      - name: Create Laravel .env
        run: |
          cat > src/boardy-laravel/.env << 'ENVEOF'
          APP_NAME=Boardy
          APP_ENV=local
          APP_KEY=base64:mpvUnT620VfxF5JMrUv8JyEztkIV8OjOsBybr0tis0I=
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=boardy_laravel
          DB_USERNAME=boardy
          DB_PASSWORD=boardy_password
          REDIS_HOST=redis
          REDIS_PORT=6379
          CACHE_DRIVER=redis
          SESSION_DRIVER=redis
          QUEUE_CONNECTION=redis
          ENVEOF
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: |
          docker compose up -d
          for i in {1..30}; do
            curl -fs http://localhost/health && break
            sleep 2
          done
      - name: Smoke endpoints
        run: |
          curl -f http://localhost/health
          curl -f http://localhost/api/health
      - name: Tear down
        if: always()
        run: docker compose down -v

  test:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install PHP deps
        working-directory: ./src/boardy-laravel
        run: composer install --no-interaction --prefer-dist
      - name: Create Laravel .env for tests
        working-directory: ./src/boardy-laravel
        run: |
          echo "APP_NAME=Boardy" > .env
          echo "APP_ENV=testing" >> .env
          echo "APP_KEY=base64:mpvUnT620VfxF5JMrUv8JyEztkIV8OjOsBybr0tis0I=" >> .env
          echo "APP_DEBUG=true" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "CACHE_DRIVER=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
      - name: Run PHPUnit
        working-directory: ./src/boardy-laravel
        run: php artisan test --filter=HealthTest
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install fastapi pytest httpx -q
      - name: Run pytest
        working-directory: ./src/boardy-api
        run: pytest tests/test_health.py -v

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Laravel image
        uses: docker/build-push-action@v5
        with:
          context: ./src/boardy-laravel
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-php:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-php:latest
      - name: Build and push FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: ./src/boardy-api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/boardy
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
